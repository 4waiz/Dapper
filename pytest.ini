# `python -m pytest -q` must keep reporting exactly the 69 tests the paper cites
# (Sec. IV-A: "a self-contained Python package containing ... and 69 automated
# tests"), so the default collection is pinned to the camera-ready suite.
#
# The post-camera-ready web-engine suite is a separate, additive run:
#     python -m pytest tests_web -q
# CI runs both.
[pytest]
testpaths = tests
